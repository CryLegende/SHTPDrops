name: SHTPDrops
version: '${project.version}'
main: org.Cry_Legende.sHTPDrops.SHTPDrops
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, les préférences restent locales (preferences.json) comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (préférences en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  tpdrops:
    description: Toggle the SHTPDrops functionality.
    usage: /<command>
    permission: shtpdrops.use
  shtpdrops:
    description: Administration de SHTPDrops.
    usage: /<command> <import|reload|info>

permissions:
  shtpdrops.use:
    description: Utiliser /tpdrops et profiter de la téléportation des drops.
    default: op
  shtpdrops.admin:
    description: Administration de SHTPDrops (toutes les sous-commandes de /shtpdrops).
    default: op
    children:
      shtpdrops.admin.import: true
      shtpdrops.admin.reload: true
      shtpdrops.admin.info: true
  shtpdrops.admin.import:
    description: Reprendre preferences.json dans la base partagée, mode réseau (/shtpdrops import).
    default: op
  shtpdrops.admin.reload:
    description: Recharger config.yml et messages.yml (/shtpdrops reload).
    default: op
  shtpdrops.admin.info:
    description: Voir pourquoi le ramassage automatique est actif ou non pour un joueur (/shtpdrops info).
    default: op
